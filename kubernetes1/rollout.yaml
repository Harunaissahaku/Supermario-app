apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mario-rollout
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mario
  template:
    metadata:
      labels:
        app: mario
    spec:
      containers:
        - name: mario
          image: sevenajay/mario
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
  strategy:
    canary:
      # Without a traffic router, weight is approximated by pod count.
      # With 2 replicas, 50% = 1 canary pod + 1 stable pod.
      steps:
        - setWeight: 50
        - pause: {}             # wait for manual promotion
        - setWeight: 100
